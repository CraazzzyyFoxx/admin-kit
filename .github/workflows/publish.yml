name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the registry trusts this workflow's OIDC token, no NPM_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11 (trusted publishing needs 11.5.1+). No dependency cache in a release build.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # prepublishOnly runs typecheck, tests and the build; provenance comes with trusted publishing.
      - run: npm publish --access public
